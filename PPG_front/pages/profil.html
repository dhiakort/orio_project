<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ORIO — Mon profil</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --indigo:#6366f1; --indigo-dark:#4f46e5; --indigo-light:#e0e7ff; --bg:#f8faff; --text:#1e293b; --text-soft:#64748b; --border:#e2e8f0; --green:#059669; --red:#dc2626; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:24px 20px 48px; }
    .wrap { max-width:560px; margin:0 auto; }
    .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
    h1 { font-family:'Baloo 2',cursive; font-size:24px; font-weight:900; color:var(--indigo-dark); }
    .back { text-decoration:none; color:var(--indigo); font-weight:700; font-size:14px; }
    .card { background:white; border:1.5px solid var(--border); border-radius:20px; padding:24px; box-shadow:0 4px 20px rgba(99,102,241,.08); }
    .fg { margin-bottom:14px; }
    label { display:block; font-size:12px; font-weight:700; margin-bottom:5px; }
    label em { color:var(--indigo); font-style:normal; }
    input, select { width:100%; border:2px solid var(--border); border-radius:12px; padding:10px 12px; font-family:inherit; font-size:14px; }
    input:focus, select:focus { outline:none; border-color:var(--indigo); box-shadow:0 0 0 3px rgba(99,102,241,.12); }
    input:disabled { background:#f1f5f9; color:var(--text-soft); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .err { display:none; background:#fef2f2; border:1px solid #fecaca; color:var(--red); padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:12px; }
    .err.show { display:block; }
    .ok { display:none; background:#d1fae5; border:1px solid #86efac; color:var(--green); padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:12px; }
    .ok.show { display:block; }
    .btn { width:100%; margin-top:8px; padding:12px; border:none; border-radius:12px; font-family:'Baloo 2',cursive; font-size:15px; font-weight:800; color:white; background:linear-gradient(135deg,var(--indigo),#38bdf8); cursor:pointer; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .btn-sec { background:white; color:var(--text); border:1.5px solid var(--border); margin-top:8px; }
    .hint { font-size:11px; color:var(--text-soft); margin-top:4px; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:white; padding:11px 18px; border-radius:12px; font-size:13px; font-weight:700; opacity:0; transition:.35s; z-index:99; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    @media(max-width:480px){ .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Mon profil</h1>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <a href="chatbot.html" style="text-decoration:none;color:#6366f1;font-weight:700;font-size:14px;background:none;border:1.5px solid #e0e7ff;border-radius:8px;padding:6px 14px;cursor:pointer;transition:all .2s" onmouseover="this.style.background='#e0e7ff'" onmouseout="this.style.background='none'">
        🤖 Assistant
      </a>
      <a class="back" href="dashboard.html">← Dashboard</a>
    </div>
  </div>

  <div class="card">
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>

    <form id="form">
      <div class="grid">
        <div class="fg">
          <label for="first_name">Prénom <em>*</em></label>
          <input id="first_name" name="first_name" required/>
        </div>
        <div class="fg">
          <label for="last_name">Nom <em>*</em></label>
          <input id="last_name" name="last_name" required/>
        </div>
      </div>

      <div class="fg">
        <label for="email">E-mail</label>
        <input id="email" type="email" disabled/>
        <p class="hint">L'e-mail ne peut pas être modifié.</p>
      </div>

      <div class="fg">
        <label for="niveau">Niveau scolaire</label>
        <select id="niveau" name="niveau">
          <option value="">— Non renseigné —</option>
          <option value="1ere">1ère année secondaire</option>
          <option value="2eme_s">2ème année secondaire</option>
          <option value="3eme_s">3ème année secondaire</option>
          <option value="4eme_s">Terminale (Bac)</option>
        </select>
      </div>

      <div class="fg">
        <label for="specialite">Section / spécialité</label>
        <select id="specialite" name="specialite">
          <option value="">— Aucune / tronc commun —</option>
          <optgroup label="2ème année">
            <option value="scientifique">Scientifique</option>
            <option value="informatique">Informatique</option>
            <option value="economique">Économie & Gestion</option>
            <option value="lettres">Lettres</option>
          </optgroup>
          <optgroup label="Bac (3ème / 4ème)">
            <option value="mathematiques">Mathématiques</option>
            <option value="sciences_exp">Sciences expérimentales</option>
            <option value="sciences_tech">Sciences techniques</option>
            <option value="sciences_info">Sciences informatique</option>
            <option value="eco_gestion">Économie & Gestion</option>
            <option value="lettres_bac">Lettres</option>
            <option value="sport_bac">Sport</option>
          </optgroup>
        </select>
        <p class="hint">Modifier le niveau peut affecter tes recommandations d'orientation.</p>
      </div>

      <button type="submit" class="btn" id="btn-save">Enregistrer</button>
      <button type="button" class="btn btn-sec" onclick="logout()">Déconnexion</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script>
if (!requireAuth()) throw new Error('auth');

const form = document.getElementById('form');

async function loadProfile() {
  const res = await apiFetch('/auth/me/');
  if (!res || !res.ok) {
    document.getElementById('err').textContent = 'Impossible de charger le profil.';
    document.getElementById('err').classList.add('show');
    return;
  }
  const user = await res.json();
  setUser(user);
  form.first_name.value = user.first_name || '';
  form.last_name.value  = user.last_name || '';
  form.email.value      = user.email || '';
  form.niveau.value     = user.niveau || '';
  form.specialite.value = user.specialite || '';
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn-save');
  const errEl = document.getElementById('err');
  const okEl  = document.getElementById('ok');
  errEl.classList.remove('show');
  okEl.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  const payload = {
    first_name: form.first_name.value.trim(),
    last_name:  form.last_name.value.trim(),
    niveau:     form.niveau.value || null,
    specialite: form.specialite.value || null,
  };

  const res = await apiFetch('/auth/me/', {
    method: 'PATCH',
    body:   JSON.stringify(payload),
  });

  btn.disabled = false;
  btn.textContent = 'Enregistrer';

  if (!res) return;
  const data = await res.json().catch(() => ({}));

  if (res.ok) {
    if (data.user) setUser(data.user);
    okEl.textContent = data.message || 'Profil mis à jour.';
    okEl.classList.add('show');
    toast('Profil enregistré', 'ok');
  } else {
    const msg = typeof data === 'object'
      ? Object.values(data).flat().join(' ')
      : 'Erreur lors de la mise à jour.';
    errEl.textContent = msg;
    errEl.classList.add('show');
  }
});

loadProfile();
</script>
</body>
</html>
