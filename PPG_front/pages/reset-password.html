<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réinitialisation du mot de passe - ORIO</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="card">
      <div class="card-header">
        <div class="logo">
          <a href="index.html"><img src="../assets/images/logo.png" alt="ORIO" /></a>
        </div>
        <div class="card-title">Réinitialiser ton mot de passe</div>
        <div class="card-subtitle">Défini un nouveau mot de passe pour ton compte.</div>
      </div>

      <div class="error-box" id="message-box">
        <span id="message-text"></span>
      </div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="password">Nouveau mot de passe <span>*</span></label>
          <input id="password" name="password" type="password" placeholder="Nouveau mot de passe" required autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label for="password_confirm">Confirme le mot de passe <span>*</span></label>
          <input id="password_confirm" name="password_confirm" type="password" placeholder="Confirmer le mot de passe" required autocomplete="new-password" />
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Réinitialiser</button>
      </form>

      <div class="divider">ou</div>
      <div class="card-footer">
        <a href="login.html">Retour à la connexion</a>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const uid = params.get('uid');
    const token = params.get('token');
    const form = document.getElementById('reset-form');
    const msgBox = document.getElementById('message-box');
    const msgText = document.getElementById('message-text');
    const btn = document.getElementById('submit-btn');

    if (!uid || !token) {
      msgText.textContent = 'Lien invalide ou incomplet. Vérifie le lien dans ton e-mail.';
      msgBox.classList.add('visible', 'error');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgBox.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Réinitialisation…';

      const res = await fetch('http://127.0.0.1:8000/api/auth/password-reset/confirm/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          uid,
          token,
          password: form.password.value,
          password_confirm: form.password_confirm.value,
        }),
      });

      const data = await res.json();
      btn.disabled = false;
      btn.textContent = 'Réinitialiser';

      if (res.ok) {
        msgText.textContent = data.message || 'Mot de passe réinitialisé. Tu peux te connecter.';
        msgBox.classList.add('visible');
        msgBox.classList.remove('error');
        setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      } else {
        msgText.textContent = Array.isArray(data.error) ? data.error.join(' ') : data.error || 'Impossible de réinitialiser le mot de passe.';
        msgBox.classList.add('visible', 'error');
      }
    });
  </script>
</body>
</html>
