<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ORIO — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --indigo: #6366f1;
      --indigo-light: #e0e7ff;
      --blue: #38bdf8;
      --blue-dark: #0284c7;
      --green: #34d399;
      --white: #ffffff;
      --text: #1e293b;
      --text-soft: #64748b;
      --border: #e2e8f0;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 40%, #ede9fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating shapes */
    .bg-shapes { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .bubble {
      position:absolute; border-radius:50%; opacity:0.15;
      animation: floatUp linear infinite;
    }
    .bubble:nth-child(1) { width:90px;  height:90px;  background:#6366f1; left:8%;  bottom:-100px; animation-duration:13s; }
    .bubble:nth-child(2) { width:55px;  height:55px;  background:#38bdf8; left:25%; bottom:-100px; animation-duration:9s;  animation-delay:2s; }
    .bubble:nth-child(3) { width:110px; height:110px; background:#34d399; left:55%; bottom:-100px; animation-duration:16s; animation-delay:1s; }
    .bubble:nth-child(4) { width:65px;  height:65px;  background:#fbbf24; left:75%; bottom:-100px; animation-duration:11s; animation-delay:3s; }
    .bubble:nth-child(5) { width:45px;  height:45px;  background:#f472b6; left:90%; bottom:-100px; animation-duration:8s;  animation-delay:0.5s; }

    .star { position:absolute; animation: twinkle 3s ease-in-out infinite; opacity:0.5; font-size:22px; }
    .star:nth-child(6) { top:7%;  left:7%;  animation-delay:0s; }
    .star:nth-child(7) { top:10%; right:9%; animation-delay:1.2s; }
    .star:nth-child(8) { top:65%; left:5%; animation-delay:0.6s; }
    .star:nth-child(9) { top:78%; right:6%; animation-delay:2s; }

    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity:0.15; }
      100% { transform: translateY(-110vh) rotate(720deg); opacity:0; }
    }
    @keyframes twinkle {
      0%,100% { transform: scale(1) rotate(0deg); opacity:0.4; }
      50%     { transform: scale(1.3) rotate(20deg); opacity:0.8; }
    }

    /* Card */
    .card {
      position: relative; z-index:1;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      box-shadow: 0 8px 40px rgba(99,102,241,0.12), 0 2px 8px rgba(0,0,0,0.06);
      padding: 40px;
      width: 100%; max-width: 440px;
      animation: slideUp 0.6s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(32px) scale(0.97); }
      to   { opacity:1; transform: translateY(0)    scale(1); }
    }

    /* Header */
    .card-header { text-align:center; margin-bottom:32px; }
    .logo {
      display: inline-flex; align-items: center; gap:10px; margin-bottom:14px;
    }
    .logo-icon {
      width:54px; height:54px;
      display:flex; align-items:center; justify-content:center;
      animation: bounceLogo 2s ease-in-out infinite;
    }
    .logo-icon img {
      width:54px; height:54px;
      object-fit:contain;
    }
    @keyframes bounceLogo {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-5px); }
    }
    .logo-text {
      font-family: 'Baloo 2', cursive;
      font-size:30px; font-weight:800;
      background: linear-gradient(135deg, var(--indigo), var(--blue-dark));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .card-title { font-family:'Baloo 2',cursive; font-size:20px; font-weight:700; color:var(--text); margin-bottom:4px; }
    .card-subtitle { font-size:14px; color:var(--text-soft); }

    /* Form */
    .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    label { font-size:13px; font-weight:600; color:var(--text); }
    label span { color:var(--indigo); }

    input {
      width:100%;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size:15px;
      font-family:'Nunito',sans-serif;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline:none;
    }
    input:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    input::placeholder { color:#b0bec5; }

    /* Password */
    .input-pw-wrapper { position:relative; }
    .input-pw-wrapper input { padding-right:44px; }
    .pw-toggle {
      position:absolute; right:13px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; color:var(--text-soft);
      padding:0; line-height:1; transition:color 0.2s;
    }
    .pw-toggle:hover { color:var(--indigo); }
    .pw-toggle svg { width:18px; height:18px; }

    /* Error */
    .error-box {
      display:none;
      background:#fef2f2; border:1.5px solid #fecaca;
      border-radius: var(--radius-sm);
      padding:10px 14px; font-size:13px; color:#dc2626;
      margin-bottom:16px; gap:8px; align-items:flex-start;
    }
    .error-box.visible { display:flex; }

    /* Submit */
    .btn-submit {
      width:100%; margin-top:8px;
      padding: 14px;
      border:none; border-radius: var(--radius-sm);
      font-family:'Baloo 2',cursive;
      font-size:16px; font-weight:700; color:white;
      background: linear-gradient(135deg, var(--indigo) 0%, var(--blue) 100%);
      cursor:pointer;
      box-shadow: 0 4px 16px rgba(99,102,241,0.32);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      position:relative; overflow:hidden;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99,102,241,0.38);
    }
    .btn-submit:disabled { opacity:0.7; cursor:not-allowed; }

    .btn-submit .ripple {
      position:absolute; border-radius:50%;
      background:rgba(255,255,255,0.4);
      transform:scale(0);
      animation:rippleAnim 0.6s linear;
      pointer-events:none;
    }
    @keyframes rippleAnim { to { transform:scale(4); opacity:0; } }

    .spinner {
      display:inline-block; width:18px; height:18px;
      border:2.5px solid rgba(255,255,255,0.4);
      border-top-color:white; border-radius:50%;
      animation:spin 0.7s linear infinite;
      vertical-align:middle; margin-right:6px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Divider */
    .divider {
      display:flex; align-items:center; gap:12px;
      margin: 20px 0; color:var(--text-soft); font-size:13px;
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px; background:var(--border);
    }

    /* Welcome back pill */
    .welcome-pill {
      display:inline-flex; align-items:center; gap:6px;
      background: var(--indigo-light); color:var(--indigo);
      border-radius:99px; padding:6px 14px;
      font-size:13px; font-weight:600;
      margin-bottom:16px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.2); }
      50%     { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
    }

    /* Footer */
    .card-footer { text-align:center; margin-top:20px; font-size:14px; color:var(--text-soft); }
    .card-footer a { color:var(--indigo); font-weight:700; text-decoration:none; transition:color 0.2s; }
    .card-footer a:hover { color:var(--blue-dark); text-decoration:underline; }
    .forgot-link { display:block; text-align:right; font-size:12px; margin-top:4px; }
    .forgot-link a { color:var(--text-soft); font-size:12px; text-decoration:none; font-weight:500; }
    .forgot-link a:hover { color:var(--indigo); text-decoration:underline; }

    @media (max-width:480px) {
      .card { padding:28px 20px 32px; }
    }
  </style>
</head>
<body>

  <div class="bg-shapes">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="star">⭐</div>
    <div class="star">✨</div>
    <div class="star">🌟</div>
    <div class="star">💫</div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="logo">
        <div class="logo-icon"><img src="../assets/images/logo.png" alt="ORIO"/></div>
      </div>
      <div class="welcome-pill"> Content de te revoir !</div>
      <div class="card-title">Connexion à ton compte</div>
      <div class="card-subtitle">Continue ton parcours d'orientation 🚀</div>
    </div>

    <div class="error-box" id="error-box">
      <span></span>
      <span id="error-msg"></span>
    </div>

    <form id="login-form" novalidate>

      <div class="form-group">
        <label for="email">Adresse e-mail <span>*</span></label>
        <input id="email" name="email" type="email"
               placeholder="exemple@email.com" required autocomplete="email"/>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe <span>*</span></label>
        <div class="input-pw-wrapper">
          <input id="password" name="password" type="password"
                 placeholder="Ton mot de passe" required autocomplete="current-password"/>
          <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Voir mot de passe">
            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="forgot-link">
          <a href="forgot-password.html">Mot de passe oublié ?</a>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn" onclick="ripple(event)">
        Se connecter 
      </button>
    </form>

    <div class="divider">ou</div>

    <div class="card-footer">
      Pas encore de compte ? <a href="register.html">Créer un compte</a>
    </div>
  </div>

  <script>
    function togglePw() {
      const input = document.getElementById('password');
      const svg   = document.getElementById('eye-icon');
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      svg.innerHTML = isText
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    }

    function ripple(e) {
      const btn = e.currentTarget;
      const circle = document.createElement('span');
      const d = Math.max(btn.clientWidth, btn.clientHeight);
      const r = btn.getBoundingClientRect();
      circle.className = 'ripple';
      circle.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
      btn.appendChild(circle);
      setTimeout(() => circle.remove(), 700);
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form     = e.target;
      const errorBox = document.getElementById('error-box');
      const btn      = document.getElementById('submit-btn');

      errorBox.classList.remove('visible');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Connexion…';

      const payload = {
        email:    form.email.value.trim(),
        password: form.password.value,
      };

      try {
        const res  = await fetch('http://127.0.0.1:8000/api/auth/login/', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload),
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('access_token',  data.tokens.access);
          localStorage.setItem('refresh_token', data.tokens.refresh);
          localStorage.setItem('user', JSON.stringify(data.user));

          btn.innerHTML = ' Connecté ! Redirection…';
          btn.style.background = 'linear-gradient(135deg,#34d399,#059669)';
          setTimeout(() => window.location.href = './dashboard.html', 1000);
        } else {
          showError(data.error || 'Identifiants incorrects. Réessaie ! ');
          btn.disabled = false;
          btn.innerHTML = 'Se connecter ';
        }
      } catch {
        showError('Erreur réseau. Vérifie ta connexion. ');
        btn.disabled = false;
        btn.innerHTML = 'Se connecter ';
      }
    });

    function showError(msg) {
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('error-box').classList.add('visible');
    }
  </script>
</body>
</html>
